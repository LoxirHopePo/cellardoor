<style>*{box-sizing:border-box;margin:0;padding:0}
body{background:#16130f;color:#d8d0c2;font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:16px;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:20px;letter-spacing:3px;color:#e8e0d2;text-align:center}
#subtitle{text-align:center;font-size:13px;color:#9a8f7e;margin:6px 0 4px}
#hint{text-align:center;font-size:12px;color:#6e6452;margin-bottom:12px}
.panel{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{background:#23201b;border:1px solid #3a342e;border-radius:10px;padding:10px;flex:1 1 440px;max-width:560px}
.card h2{font-size:14px;color:#cbb89a;margin-bottom:8px;display:flex;justify-content:space-between}
.stage{position:relative;aspect-ratio:1/1;background:#2a2620;border:2px solid #4a4238;border-radius:6px;overflow:hidden;cursor:crosshair}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;pointer-events:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.outline{fill:rgba(255,60,60,.14);stroke:#ff3b3b;stroke-width:5;stroke-linejoin:round;display:none}
.hintmark{fill:rgba(255,196,0,.10);stroke:#ffd23c;stroke-width:5;stroke-linejoin:round;stroke-dasharray:14 8;display:none;animation:hpulse 1s infinite}
@keyframes hpulse{0%,100%{opacity:.45}50%{opacity:1}}
.bar{text-align:center;margin:14px 0 6px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{background:#3a2f23;color:#e8e0d2;border:1px solid #5a4a35;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{background:#4a3c2c}
.btn.active{background:#7f2020;border-color:#ff5555}
#hud{font-size:15px;color:#e8e0d2;background:#2a2620;padding:8px 14px;border-radius:8px;border:1px solid #4a4238}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#7f2020;color:#fff;padding:10px 22px;border-radius:8px;opacity:0;transition:opacity .25s;z-index:99;pointer-events:none}
#toast.show{opacity:1}
#toast.ok{background:#1e5a2a}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{background:#2a2620;border:1px solid #4a4238;padding:6px 12px;border-radius:20px;font-size:12px;color:#9a8f7e}
.chip.ok{background:#1e3a23;border-color:#2f9e44;color:#b4e6b4}
.win{margin-top:14px;border:1px dashed #cbb89a;border-radius:10px;padding:16px;text-align:center;color:#cbb89a;font-size:15px;display:none}
.win.show{display:block}
</style>
</head>

let levelIndex = 0, found = new Set(), toastTimer = null, hintTimers = [];
const NS = "http://www.w3.org/2000/svg";
let current = null;

function toast(msg, ok) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = ok ? "ok" : "";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1500);
}

function buildMarks(svgId) {
  const svg = document.getElementById(svgId);
  svg.innerHTML = "";
  current.D.forEach(d => {
    d.polys.forEach(pts => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", "M" + pts.map(q => q[0] + " " + q[1]).join(" L") + " Z");
      p.setAttribute("class", "outline");
      p.setAttribute("data-diff", d.id);
      svg.appendChild(p);
    });
  });
}

function buildHints() {
  ["markLayerA", "markLayerB"].forEach(svgId => {
    const svg = document.getElementById(svgId);
    current.D.forEach(d => {
      d.polys.forEach(pts => {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", "M" + pts.map(q => q[0] + " " + q[1]).join(" L") + " Z");
        p.setAttribute("class", "hintmark");
        p.setAttribute("data-hint", d.id);
        svg.appendChild(p);
      });
    });
  });
}

function distToSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  if (dx === 0 && dy === 0) return Math.hypot(px - ax, py - ay);
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}
function pointInPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function pointInDiff(x, y) {
  for (const d of current.D) {
    for (const pts of d.polys) {
      if (pts.length > 2 && pointInPoly(x, y, pts)) return d.id;
      for (let i = 0; i < pts.length - 1; i++) {
        if (distToSeg(x, y, pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1]) <= d.tol) return d.id;
      }
      if (pts.length > 1 && distToSeg(x, y, pts[pts.length-1][0], pts[pts.length-1][1], pts[0][0], pts[0][1]) <= d.tol) return d.id;
    }
  }
  return null;
}

function render() {
  current = LEVELS[levelIndex];
  found.clear();
  hintTimers.forEach(t => clearTimeout(t)); hintTimers = [];
  document.getElementById("subtitle").textContent = current.title;
  document.getElementById("hint").textContent = current.hint;
  document.getElementById("imgA").src = current.L;
  document.getElementById("imgB").src = current.R;
  buildMarks("markLayerA");
  buildMarks("markLayerB");
  buildHints();
  document.getElementById("cnt").textContent = "0 / " + current.D.length;
  document.getElementById("hud").textContent = "剩余 " + current.D.length + " / " + current.D.length;
  document.getElementById("chips").innerHTML = current.D.map((d, i) =>
    '<span class="chip" data-id="' + d.id + '">' + (i + 1) + ". " + d.label + "</span>").join("");
  document.getElementById("win").classList.remove("show");
  document.getElementById("nextLevel").style.display = levelIndex < LEVELS.length - 1 ? "" : "none";
}

function clickStage(stageId, e) {
  const st = document.getElementById(stageId);
  const r = st.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 900;
  const y = (e.clientY - r.top) / r.height * 900;
  const d = pointInDiff(x, y);
  if (!d) { toast("这里没有变化", false); return; }
  if (found.has(d)) { toast("这里已经找到了", false); return; }
  found.add(d);
  document.querySelectorAll('.outline[data-diff="' + d + '"]').forEach(el => el.style.display = "block");
  const chip = document.querySelector('.chip[data-id="' + d + '"]');
  if (chip) chip.classList.add("ok");
  const left = current.D.length - found.size;
  document.getElementById("hud").textContent = left > 0 ? "剩余 " + left + " / " + current.D.length : "全部找到 ✓";
  document.getElementById("cnt").textContent = found.size + " / " + current.D.length;
  toast("找到了：" + current.D.find(x => x.id === d).label, true);
  if (left === 0) document.getElementById("win").classList.add("show");
}

document.getElementById("stageA").addEventListener("click", e => clickStage("stageA", e));
document.getElementById("stageB").addEventListener("click", e => clickStage("stageB", e));
document.getElementById("btnReset").onclick = render;
document.getElementById("btnHint").onclick = () => {
  const rest = current.D.filter(d => !found.has(d.id));
  if (!rest.length) { toast("已经全部找到了", true); return; }
  const d = rest[Math.floor(Math.random() * rest.length)];
  document.querySelectorAll(".hintmark[data-hint='" + d.id + "']").forEach(el => { el.style.display = "block"; });
  toast("提示：" + d.label + " 在这里", true);
  hintTimers.forEach(t => clearTimeout(t));
  hintTimers = [setTimeout(() => {
    document.querySelectorAll(".hintmark[data-hint='" + d.id + "']").forEach(el => { el.style.display = "none"; });
  }, 3200)];
};
document.getElementById("nextLevel").onclick = () => {
  if (levelIndex < LEVELS.length - 1) { levelIndex++; render(); }
  else toast("全部关卡完成", true);
};
render();
